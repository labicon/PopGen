defaults:
  - strategy: stratified
  - _self_

# Environment selection
env: football

# Generation settings
n_groups: 1  # Number of behavior groups to generate
n_behaviors_per_group: 5  # Number of behaviors per group
n_workers: 1  # Number of parallel workers

# Output directory
output_dir: ./results/${env}/${classname:${strategy._target_}}__${basename:${strategy.model}}

hydra:
  run:
    dir: ${output_dir}
  sweep:
    dir: ${output_dir}/multirun
    subdir: ${hydra.job.num}
