# Environment selection
env: football

# Behavior generation strategy
strategy: stratified  # Options: stratified, in_context

# LLM model selection (litellm format)
llm_model: openai/gpt-5-mini

# Pipeline settings
max_behaviors: 5
max_alignment_retries: 3
n_eval_rollouts: 1
n_workers: 1  # Number of parallel workers for behavior processing

# Output directory (relative to working directory)
output_dir: ./results

hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_dir}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
