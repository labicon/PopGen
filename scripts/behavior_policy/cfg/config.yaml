# Environment selection
env: football

# Behavior generation strategy
strategy: stratified  # Options: stratified, in_context

# LLM model selection (litellm format)
llm_model: openai/gpt-5-nano

# Pipeline settings
max_behaviors: 5
max_alignment_retries: 3
n_eval_rollouts: 5
adherence_threshold: 1.0  # Minimum adherence score for successful alignment
n_workers: 8  # Number of parallel workers for behavior processing
align: true  # Run policy generation & evaluation (stage 2)

# Output directory (relative to working directory)
output_dir: ./results/${env}
run_name: ${strategy}__${basename:${llm_model}}__${now:%Y-%m-%d_%H-%M-%S}

hydra:
  run:
    dir: ${output_dir}/${run_name}
  sweep:
    dir: ${output_dir}/${run_name}
    subdir: ${hydra.job.num}
