env: point_mass_rendezvous

self_play:
  # Explicit training seeds for each member. If null, seeds are sampled from
  # population_seed when set; otherwise use range(n_seeds).
  seeds: null
  n_seeds: 4
  population_seed: null

  # Number of parallel workers (set >1 only with multiple GPUs)
  n_workers: 2

  output_dir: ./results/${env}/self_play
  run_name: ${now:%Y-%m-%d_%H-%M-%S}

  # Optional path to an existing self-play run directory to resume from.
  # When set, training resumes from the latest checkpoint in each seed_*/
  # subdirectory. Seeds without checkpoints are trained from scratch.
  # The run directory is reused as-is; run_name and output_dir are ignored.
  restart_from: null

  # Forwarded as kwargs to self-play MAPPO training
  train_kwargs: {}

cooperator:
  # For standalone cooperator runs; if null, defaults to current self_play run.
  self_play_results_dir: null
  # Optional checkpoint file, experiment dir, or cooperator run dir to resume from.
  # When set, cooperator training restarts from the resolved checkpoint and writes
  # back into that existing cooperator run directory.
  restart_from: null
  output_subdir: cooperator
  run_name: ${now:%Y-%m-%d_%H-%M-%S}

  # Forwarded as kwargs to env_module.train_fn(...).
  # Do not set `run_name` here: it is computed by the training pipeline.
  train_kwargs: {}

evaluation:
  # For standalone evaluation; if null, defaults to cooperator/self_play fallback.
  run_dir: null
  n_eval_rollouts: 50
  num_workers: 8
  seed: null

pipeline:
  # Set to false to skip self-play and train cooperator against an existing population.
  # Requires cooperator.self_play_results_dir to point at a directory with seed_*/ subdirs.
  run_self_play: true
  # Full pipeline only: run evaluation after cooperator training.
  run_evaluation: true

hydra:
  run:
    dir: ${self_play.output_dir}/${self_play.run_name}
  sweep:
    dir: ${self_play.output_dir}/${self_play.run_name}
    subdir: ${hydra.job.num}
