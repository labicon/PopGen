generation:
  type: policy_code
  model_name: openrouter/google/gemini-3-flash-preview
  n_generation_retries: 5
behavior:
  _target_: popgen.population.generation.diversity.VerbalizedSamplingStrategy
  model_config:
    model_name: openrouter/google/gemini-3.1-pro-preview
  probability_tuning: null
  do_cot: false
  reranker_multiplier: 2
behavior_path: ./data/behaviors/${env}.json
env: football
evaluation:
  evaluator_model: openrouter/google/gemini-3-flash-preview
  max_alignment_retries: 3
  n_eval_rollouts: 3
  adherence_threshold: 0.8
n_behaviors: 4
n_workers: 9
n_trials: 1
seed: 0
output_dir: ./results/${env}/${generation.type}/${basename:${generation.model_name}}
run_name: ${generation.model_name}
