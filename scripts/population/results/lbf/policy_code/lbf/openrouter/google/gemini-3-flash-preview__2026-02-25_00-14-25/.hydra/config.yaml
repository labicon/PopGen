generation:
  type: policy_code
  model_name: openrouter/google/gemini-3-flash-preview
behavior:
  _target_: popgen.population.generation.diversity.VerbalizedSamplingStrategy
  model_config:
    model_name: openai/gpt-5-nano
  probability_tuning: null
  do_cot: false
behavior_path: ./behaviors/${env}.json
env: lbf
evaluation:
  evaluator_model: openrouter/google/gemini-3-flash-preview
  max_alignment_retries: 3
  n_eval_rollouts: 3
  adherence_threshold: 0.8
n_behaviors: 3
n_workers: 9
num_trials: 1
seed: 0
output_dir: ./results/${env}/${generation.type}/${behavior_source:${behavior_path},${behavior._target_}}
run_name: ${generation.model_name}__${now:%Y-%m-%d_%H-%M-%S}
