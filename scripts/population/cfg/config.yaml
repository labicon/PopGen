defaults:
  - generation: policy_code   # Options: rl_reward, policy_code, llm_agent
  - behavior: verbalized_sampling   # Options: stratified, in_context, verbalized_sampling, verbalized_sampling_multiturn
  - _self_

# Optional: pass a path to a pre-generated behaviors JSON to skip behavior generation
behavior_path: ./data/behaviors/${env}.json

# Environment
env: lbf

# Evaluation settings
evaluation:
  evaluator_model: openrouter/google/gemini-3-flash-preview
  max_alignment_retries: 3
  n_eval_rollouts: 3
  adherence_threshold: 0.8

n_behaviors: 1
n_workers: 9
n_trials: 1
seed: 0

# Output
output_dir: ./results/${env}/${generation.type}/${basename:${generation.model_name}}
run_name: ${generation.model_name}

hydra:
  run:
    dir: ${output_dir}
  sweep:
    dir: ${output_dir}
    subdir: ${hydra.job.num}
