defaults:
  - behavior: verbalized_sampling
  - _self_

# Environment selection
env: football

agent:
  # LLM model settings
  model_config:
    model_name: openrouter/deepseek/deepseek-v3.2
  # Runtime action generation parameters
  horizon_length: 25  # Number of steps to plan ahead (1 = single-step, >1 = multi-step trajectory)
  include_trajectory_history: false  # Whether to include previous trajectory in context


# Evaluator model configuration
evaluator:
  model_name: openrouter/openai/gpt-5-nano

# Pipeline settings
max_behaviors: 5
max_evaluation_attempts: 1
n_eval_rollouts: 5
adherence_threshold: 1.0
n_workers: 4
evaluate: true

# Output
output_dir: ./results/${env}/llm_agent
run_name: ${behavior}__agent_${basename:${agent.model_config.model_name}}__${now:%Y-%m-%d_%H-%M-%S}

hydra:
  run:
    dir: ${output_dir}/${run_name}
  sweep:
    dir: ${output_dir}/${run_name}
    subdir: ${hydra.job.num}
