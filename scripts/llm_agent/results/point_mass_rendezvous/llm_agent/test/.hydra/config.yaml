behavior:
  _target_: popgen.population.generation.diversity.VerbalizedSamplingStrategy
  model_config:
    model_name: openai/gpt-5-nano
  probability_tuning: null
  do_cot: false
env: point_mass_rendezvous
agent:
  model_config:
    model_name: openrouter/deepseek/deepseek-v3.2
  horizon_length: 3
  include_trajectory_history: true
evaluator:
  model_name: openai/gpt-5-nano
max_behaviors: 5
max_evaluation_attempts: 1
n_eval_rollouts: 10
adherence_threshold: 1.0
n_workers: 10
evaluate: true
output_dir: ./results/${env}/llm_agent
run_name: test
