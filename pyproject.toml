[project]
name = "popgen"
version = "0.1.0"
description = "Population generation for multi-agent reinforcement learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "hydra-core>=1.3.0",
    "litellm>=1.40.0",
    "numpy>=1.26.0",
    "pillow>=12.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["popgen"]
