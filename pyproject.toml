[project]
name = "popgen"
version = "0.1.0"
description = "Population generation for multi-agent reinforcement learning"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dotenv>=0.9.9",
    "hydra-core>=1.3.0",
    "litellm>=1.40.0",
    "matplotlib>=3.10.8",
    "numpy>=1.26.0",
    "pillow>=12.1.0",
    "pqdm>=0.2.0",
    "pydantic>=2.0.0",
    "pqdm>=0.2.0",
    "scipy>=1.11.0",
    "wandb>=0.24.0",
    "rouge-score>=0.1.2",
    "huggingface-hub>=0.34.0,<1.0",
    "sentence-transformers>=5.2.0",
    "tensordict==0.10.0",
    "torchrl==0.10.1",
    "benchmarl",
    "vmas",
    "lbforaging",
    "smacv2",
    "gymnasium>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv.sources]
benchmarl = { path = "deps/BenchMARL", editable = true }
vmas = { path = "deps/VectorizedMultiAgentSimulator", editable = true }
lbforaging = { path = "deps/lb-foraging", editable = true }
smacv2 = { git = "https://github.com/oxwhirl/smacv2.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["popgen"]

[tool.ruff]
line-length = 200
target-version = "py312"
include = ["popgen/**/*.py"]
exclude = ["popgen/envs/**/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "F401",  # unused imports (for re-exports in __init__.py)
    "F403",  # wildcard imports
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["deps", "dist", "build", ".tox", ".eggs", ".git"]
