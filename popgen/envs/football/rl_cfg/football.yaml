defaults:
  - vmas_football_config
  - _self_


max_steps: 300

# Agents config
n_blue_agents: 2
n_red_agents: 1
ai_red_agents: True  # What agents should be learning and what controlled by the heuristic (ai)

# When you have 5 blue agents, physical differences can be introduced:
# 1 goalkeeper -> slow and big
# 2 defenders -> normal size and speed (agent_size, u_multiplier, max_speed)
# 2 attackers -> small and fast
physically_different: False

# Agent spawning
spawn_in_formation: False
only_blue_formation: True  # Only spawn blue agents in formation
formation_agents_per_column: 2
randomise_formation_indices: False  # If False, each agent will always be in the same formation spot
formation_noise: 0.2  # Noise on formation positions

# Ai config
n_traj_points: 0  # Number of spline trajectory points to plot for heuristic (ai) agents
# 0.4 chosen by sweeping a payoff matrix over hand-coded reference role policies
# (attack / mark / cover / idle) in the two blue slots: it is the strength at which
# splitting roles (one attacks, one marks) is the argmax of the reference payoff
# matrix AND the two assignments are symmetric (attack/mark 52.25 vs mark/attack
# 48.67, 1.5 sigma).  At 0.3 the assignments are asymmetric (2.9 sigma), which
# would give away a "correct" convention; above 0.5 scoring becomes too rare to
# learn (6-8% of episodes at 0.9).
ai_strength: 0.4  # The speed of the ai 0<=x<=1
ai_decision_strength: 0.4  # The decision strength of the ai 0<=x<=1
ai_precision_strength: 0.4  # The precision strength of the ai 0<=x<=1

# Optional opponent-strength randomization: when set to a [low, high] range, the
# corresponding ai_*_strength above is ignored and a fresh value is sampled from
# the range on every episode reset (shared across all parallel envs until the
# next reset). Leave commented out to keep the fixed ai_*_strength values above.
# Kept off deliberately: the payoff structure is only symmetric near 0.4-0.5, so
# sampling [0.1, 0.5] would mix in asymmetric episodes.
# ai_strength_range: [0.1, 0.5]
# ai_decision_strength_range: [0.1, 0.5]
# ai_precision_strength_range: [0.1, 0.5]

# Opponent standoff: a red agent applies zero force while a blue agent is within
# this distance of it, so marking neutralises the opponent instead of both agents
# barging into the same contact zone.  0.0 restores stock VMAS behaviour.
red_standoff_radius: 0.15

# Task sizes
agent_size: 0.025
goal_size: 0.35
goal_depth: 0.1
pitch_length: 3.0
pitch_width: 1.5
ball_mass: 0.25
ball_size: 0.02

# Actions
u_multiplier: 0.12

# Actions shooting
enable_shooting: False  # Whether to enable an extra 2 actions (for rotation and shooting). Only available for non-ai agents
u_rot_multiplier: 0.0003
u_shoot_multiplier: 0.6
shooting_radius: 0.08
shooting_angle: 1.5708

# Speeds
max_speed: 0.18
ball_max_speed: 0.3

# Rewards
dense_reward: True
# 20.0 (was 10.0): heavier ball->goal shaping makes partial attacking progress pay,
# so marking is still the best response to a weak (LLM-generated) attacking partner
# that never actually scores.  Nearly doubles that margin (+4.26 -> +7.06).
pos_shaping_factor_ball_goal: 20.0
# Deliberately NOT raised: this term pays for proximity to the ball, so raising it
# rewards both agents crowding it, which pushes toward both-attack and against role
# division.  It is also the team-min term, so raising it amplifies the shared-credit
# problem where the ego is paid for the partner being near the ball.
pos_shaping_factor_agent_ball: 1.0
distance_to_ball_trigger: 0.4
scoring_reward: 50.0
# Dense per-step reward per neutralised (marked) red agent.  0.05 x ~285 steps is
# ~14 per episode, about 23% of the return in the split cells -- enough to make role
# division the argmax without becoming the dominant objective.  0.0 disables it.
neutralize_reward: 0.05

# Observations
observe_teammates: True
observe_adversaries: True
dict_obs: False
